name: Site changed / selectors broke
description: andieswim.com changed something and the parser no longer matches.
labels: ["site-change"]
body:
  - type: markdown
    attributes:
      value: |
        This is the most common way a scraper stops working, and it is worth its
        own report because the fix is different from a code bug: something on
        andieswim.com moved.

        Useful to know before filing: nothing here is read from markup. Every
        mode parses the store's own Shopify JSON (`/collections/{handle}/products.json`,
        `/products/{handle}.js`, `/search/suggest.json`), so the first thing to
        check is whether that endpoint still answers the same shape.

  - type: dropdown
    id: what_broke
    attributes:
      label: What stopped matching
      options:
        - Products (0 rows on a page that visibly has products)
        - A specific field is null or wrong (price, sku, image, URL)
        - original_price / discount_pct or variant stock columns empty out
        - Pagination stops early or repeats a page
        - The captcha detector finds nothing on a page that has one
        - Something else
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: URL
      description: The exact listing URL, and the country your exit IP was in.
      placeholder: "https://andieswim.com/en-gb/collections/one-pieces (exit IP: GB)"
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence from the page
      description: |
        Whichever of these you can get. A capture beats a description.

        - The JSON as the store serves it, e.g.
          `curl -s "https://andieswim.com/collections/one-pieces/products.json?limit=1" | head -c 2000`
        - Or a `--dump-html` capture from the failing run.
        - For a field problem: the value you got, and the value on the page.
      render: text
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: >-
        Whether it reproduces on a second engine, whether it reproduces from a
        different country, and when it last worked.
